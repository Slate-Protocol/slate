[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# The published integration package, compiled and tested here through its public import path.
allow_paths = ["../packages/contracts"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"
arbitrum = "https://arb1.arbitrum.io/rpc"

[lint]
# External interfaces (ERC-8056's uiMultiplier, Chainlink's API) and public immutable getters are
# named for their callers, not for Solidity style.
exclude_lints = ["mixed-case-function", "screaming-snake-case-immutable", "asm-keccak256"]
# Tests and deploy scripts cast literals freely (bytes32("CRWD/USD"), bounded fuzz inputs); lint production code only.
ignore = ["test/**/*.sol", "script/**/*.sol"]
