name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  fork:
    name: contracts (live fork tests)
    runs-on: ubuntu-latest
    # Blocking. Public RPCs occasionally lag or challenge CI runners, so failed tests are retried twice before the
    # job fails; a test that fails three times is a real failure.
    defaults:
      run:
        working-directory: contracts
    env:
      SLATE_FORK: "1"
      SLATE_FORK_URL_rh_mainnet: http://127.0.0.1:8548
      SLATE_FORK_URL_rh_testnet: http://127.0.0.1:8549
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: python3 script/rpc_relay.py https://rpc.mainnet.chain.robinhood.com 8548 &
      - run: python3 script/rpc_relay.py https://rpc.testnet.chain.robinhood.com 8549 &
      - name: forge test (live forks, up to 3 attempts)
        run: |
          forge test --match-path "test/fork/*" -vvv && exit 0
          sleep 20; forge test --rerun -vvv && exit 0
          sleep 40; forge test --rerun -vvv

  dashboard:
    name: dashboard (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slate/dashboard typecheck
      - run: pnpm --filter @slate/dashboard lint
      - run: pnpm --filter @slate/dashboard build

  stylus:
    name: stylus (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylus
    steps:
      - uses: actions/checkout@v4
      # installs the toolchain, target and components pinned in stylus/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
