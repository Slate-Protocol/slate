name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  fork:
    name: contracts (live fork tests)
    runs-on: ubuntu-latest
    # Public RPCs can rate-limit or challenge CI runners; a red fork job is a signal, not a merge blocker.
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    env:
      SLATE_FORK: "1"
      SLATE_FORK_URL_rh_mainnet: http://127.0.0.1:8548
      SLATE_FORK_URL_rh_testnet: http://127.0.0.1:8549
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: python3 script/rpc_relay.py https://rpc.mainnet.chain.robinhood.com 8548 &
      - run: python3 script/rpc_relay.py https://rpc.testnet.chain.robinhood.com 8549 &
      - run: forge test --match-path "test/fork/*" -vvv

  stylus:
    name: stylus (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylus
    steps:
      - uses: actions/checkout@v4
      # installs the toolchain, target and components pinned in stylus/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
